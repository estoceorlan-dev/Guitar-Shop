{% macro csrf() -%}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{%- endmacro %}

{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'guitar' %}<path d="m11 13 9-9 1 1-9 9M20 4l1-1M21 5l1-1M8 10c-2-2-5-1-6 2-1 3 1 7 4 8 3 1 6-1 6-4 3-1 4-4 2-6-2-2-4-1-6 0Z"/><circle cx="8" cy="15" r="2"/>
{% elif name == 'dashboard' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
{% elif name == 'cart' %}<path d="M2 3h3l3 12h11l3-9H6M9 20h.01M19 20h.01"/>
{% elif name == 'shield' %}<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/>
{% elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
{% elif name == 'logout' %}<path d="M9 3H4v18h5M10 12h12m-5-5 5 5-5 5"/>
{% elif name == 'search' %}<circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/>
{% elif name == 'warning' %}<path d="m12 3 10 18H2L12 3ZM12 9v4m0 4h.01"/>
{% elif name == 'trend' %}<path d="m3 17 6-6 4 4 8-10m-6 0h6v6"/>
{% elif name == 'cash' %}<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/>
{% elif name == 'card' %}<rect x="2" y="3" width="20" height="18" rx="2"/><path d="M2 9h20"/>
{% elif name == 'phone' %}<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>
{% endif %}
</svg>
{%- endmacro %}
